<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArtyLab | Gabriel S. Silva</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dvdehqooq/image/upload/v1770336660/artylab_t9tkkb.png" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'soul-purple': '#9929EA',
              'soul-violet': '#5808FB',
              'anthracite-start': '#2D2D2D',
              'anthracite-end': '#383838',
              'off-white': '#ECEDEA',
              'light-bg': '#F5F5F7',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['Calibri', '"Roboto"', 'sans-serif'],
            },
            cursor: {
              none: 'none',
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'glow-pulse': 'glowPulse 3s infinite',
              'loading-bar': 'loadingBar 2s infinite linear',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              glowPulse: {
                '0%, 100%': { filter: 'drop-shadow(0 0 5px rgba(153, 41, 234, 0.4))', opacity: '1' },
                '50%': { filter: 'drop-shadow(0 0 15px rgba(153, 41, 234, 0.8))', opacity: '0.8' },
              },
              loadingBar: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* GLOBAL CURSOR RESET */
      body, a, button, input, textarea, select, [role="button"] {
        cursor: none !important;
      }
      
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #2D2D2D;
      }
      ::-webkit-scrollbar-thumb {
        background: #5808FB;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9929EA;
      }
      /* Improved Visibility for Glass Panel */
      .glass-panel {
        background: rgba(255, 255, 255, 0.08); /* Increased opacity for dark mode visibility */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.2); /* Stronger border */
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      /* Dark mode glass override to ensure contrast */
      html:not(.dark) .glass-panel {
        background: rgba(230, 230, 230, 0.7); /* Darker, richer background for light mode */
        border: 1px solid rgba(0, 0, 0, 0.15); /* Stronger border */
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15); /* Deeper shadow */
      }
      
      .text-glow {
        text-shadow: 0 0 10px rgba(153, 41, 234, 0.7), 0 0 20px rgba(88, 8, 251, 0.5);
      }

      .animate-loading-bar {
        background: linear-gradient(90deg, transparent, #9929EA, #5808FB, transparent);
        background-size: 200% 100%;
        animation: loadingBar 2s infinite linear;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.40.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-light-bg text-gray-900 dark:bg-gradient-to-br dark:from-anthracite-start dark:to-anthracite-end dark:text-off-white min-h-screen overflow-x-hidden selection:bg-soul-purple selection:text-white transition-colors duration-500 flex flex-col">
    <div id="root" class="flex-grow"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
