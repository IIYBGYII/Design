<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArtyLab</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      color: #fff;
      user-select: none;
      min-height: 100vh;
      background: linear-gradient(-45deg,
        #0a0a0a, #1a1a1a, #2a2a2a, #1c1c1c, #111111,
        #222222, #191919, #2f2f2f, #0f0f0f);
      background-size: 400% 400%;
      animation: gradientFlow 18s ease infinite;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 100px 20px 60px;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: 100px;
      height: auto;
      opacity: 0.95;
    }

    main {
      text-align: center;
      max-width: 480px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .brand-name {
      font-size: 2.8em;
      font-weight: bold;
      background: linear-gradient(to right, #9929ea, #5808fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .description {
      font-size: 1.1em;
      opacity: 0.85;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      width: 100%;
      max-width: 260px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      color: white;
      font-weight: bold;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn img {
      width: 24px;
      height: 24px;
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 14px;
      padding: 2px;
      background: linear-gradient(135deg, #9929ea, #5808fb);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
    }

    .btn:hover::after {
      opacity: 1;
    }

    .btn:hover {
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 0 18px rgba(153, 41, 234, 0.35);
    }

    footer {
      margin-top: auto;
      padding-top: 40px;
      text-align: center;
      font-size: 0.85em;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo ArtyLab" class="logo" />
  </header>

  <main>
    <h1 class="brand-name">ArtyLab</h1>
    <p class="description">Transformando ideias em design.</p>

    <div class="buttons">
      <a href="https://wa.me/seunumero" class="btn">
        <img src="icons/whatsapp.png" alt="WhatsApp" /> WhatsApp
      </a>
      <a href="https://instagram.com/seuperfil" class="btn">
        <img src="icons/instagram.png" alt="Instagram" /> Instagram
      </a>
      <a href="https://facebook.com/seupagina" class="btn">
        <img src="icons/facebook.png" alt="Facebook" /> Facebook
      </a>
    </div>
  </main>

  <footer>
    <p>Responsável: Gabriel S. Silva. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
